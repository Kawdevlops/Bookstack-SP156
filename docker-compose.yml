x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: airflow-service:3.2.2-chromium
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:admin"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__EXPOSE_CONFIG: "True"
    PYTHONPATH: /opt/airflow
    BOOKSTACK_URL: ${BOOKSTACK_URL}
    BOOKSTACK_TOKEN_ID: ${BOOKSTACK_TOKEN_ID}
    BOOKSTACK_TOKEN_SECRET: ${BOOKSTACK_TOKEN_SECRET}
    BOOKSTACK_DB_HOST: mariadb_service
    BOOKSTACK_DB_NAME: bookstack_service
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    MARIADB_HOST: ${MARIADB_HOST}
  volumes:
  - ./airflow/dags:/opt/airflow/dags
  - ./airflow/logs:/opt/airflow/logs
  - ./airflow/plugins:/opt/airflow/plugins
  - ./airflow/include:/opt/airflow/include
  - ./airflow/dados:/opt/airflow/dados
  - ./backups:/opt/airflow/backups
  networks:
    - service_net
  depends_on:
    postgres:
      condition: service_healthy

services:

  mariadb_service:
    image: mariadb:10.11
    container_name: mariadb_service
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bookstack_service
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_service_data:/var/lib/mysql
    networks:
      - service_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    # mem_limit: 1g
    # cpus: 1.0

  bookstack_service:
    image: lscr.io/linuxserver/bookstack:version-v26.05.1
    container_name: bookstack_service
    depends_on:
      mariadb_service:
        condition: service_healthy
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Sao_Paulo
      APP_URL: http://bookstack.localhost
      APP_KEY: ${BOOKSTACK_APP_KEY}
      DB_HOST: mariadb_service
      DB_PORT: 3306
      DB_DATABASE: bookstack_service
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bookstack_service_config:/config
    networks:
      - service_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    # mem_limit: 768m
    # cpus: 1.0

  postgres:
    image: postgres:16
    container_name: postgres_service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - service_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    # mem_limit: 1g
    # cpus: 1.0


  airflow-init:
    <<: *airflow-common
    container_name: airflow-init_service
    user: "${AIRFLOW_UID}:0"
    entrypoint: /bin/bash
    command:
      - -c
      - exec /entrypoint airflow db migrate
    # mem_limit: 1g
    # cpus: 1.0


  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver_service
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID}:0"
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # mem_limit: 1.5g
    # cpus: 1.0


  airflow-scheduler:
    <<: *airflow-common
    shm_size: '2gb'
    container_name: airflow-scheduler_service
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID}:0"
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # mem_limit: 4g
    # cpus: 2.0


  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor_service
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID}:0"
    command: dag-processor
    restart: unless-stopped
    # mem_limit: 1g
    # cpus: 1.0


  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-service
    restart: unless-stopped
    depends_on:
      bookstack_service:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - service_net
    # mem_limit: 128m
    # cpus: 0.5

volumes:
  mariadb_service_data:
  bookstack_service_config:
  postgres_data:

networks:
  service_net:
    name: service_net
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400